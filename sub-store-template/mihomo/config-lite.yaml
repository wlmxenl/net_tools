# https://wiki.metacubex.one/config/general/
# https://github.com/MetaCubeX/mihomo/blob/Meta/docs/config.yaml
# https://wiki.metacubex.one/example/conf/#__tabbed_3_1
# 全局配置

log-level: info # 日志等级 silent/error/warning/info/debug
mode: rule
# port: 7890 # HTTP(S) 代理服务器端口
# socks-port: 7891 # SOCKS5 代理端口
mixed-port: 20808 # HTTP(S) 和 SOCKS 代理混合端口
# redir-port: 7892 # 透明代理端口，用于 Linux 和 MacOS
# tproxy-port: 7893 # Transparent proxy server port for Linux (TProxy TCP and TProxy UDP)
allow-lan: false # 不允许局域网连接
# bind-address: "*" # 绑定 IP 地址，仅作用于 allow-lan 为 true，'*'表示所有地址
ipv6: true

unified-delay: true # 去除握手等额外延迟
tcp-concurrent: true # 同时对所有ip进行连接，返回延迟最低的地址

# find-process-mode has 3 values:always, strict, off
# - always, 开启，强制匹配所有进程
# - strict, 默认，由 mihomo 判断是否开启
# - off, 不匹配进程，推荐在路由器上使用此模式
find-process-mode: strict

#keep-alive-idle: 600
#keep-alive-interval: 15
#disable-keep-alive: false

profile:
  store-selected: true  # 存储 select 选择记录
  store-fake-ip: true # 持久化 fake-ip

# 控制面板
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: "/etc/mihomo/run/ui"
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# Tun 配置（桌面端/内核直接生效；ClashMetaForAndroid 由客户端 VPN 接管）
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"

# 域名嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  listen: 127.0.0.1:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - localhost.ptlogin2.qq.com
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "captive.apple.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
  fake-ip-ttl: 1
  default-nameserver:
    - tls://223.5.5.5:853
    - tls://1.12.12.12:853
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:private_domain,cn_domain,applecn_domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  nameserver:
    - "https://1.1.1.1/dns-query#🌐 节点选择"
    - "https://8.8.8.8/dns-query#🌐 节点选择"

# 节点信息
proxies: []

# 出站策略
proxy-groups:
  - {name: 🌐 节点选择, type: select, include-all: true}
  - {name: 🧭 漏网之鱼, type: select, proxies: [🌐 节点选择], include-all: true}

# 规则匹配
rules:
  # 进程与内网直连
  - RULE-SET,applications,DIRECT
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  # 阻断海外 QUIC，强制回退 TCP HTTP/2（放行国内直连 QUIC）
  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
  # - RULE-SET,reject_domain,REJECT

  # 域名分流
  - RULE-SET,applecn_domain,DIRECT
  - RULE-SET,ai_domain,🌐 节点选择
  - RULE-SET,google_domain,🌐 节点选择
  - RULE-SET,telegram_domain,🌐 节点选择
  - RULE-SET,cn!_domain,🌐 节点选择
  - RULE-SET,cn_domain,DIRECT

  # IP 兜底（均带 no-resolve，不触发本地解析）
  - RULE-SET,telegram_ip,🌐 节点选择,no-resolve
  - RULE-SET,cn_ip,DIRECT,no-resolve

  # 最终兜底
  - MATCH,🧭 漏网之鱼

# 规则集
rule-anchor:
  http-rule: &http-rule {type: http, interval: 86400}

  # YAML 规则集（仅用于 Loyalsoldier 进程类规则）
  yaml-class: &yaml-class {<<: *http-rule, behavior: classical, format: yaml}

  # MRS 规则集（MetaCubeX）
  mrs-domain: &mrs-domain {<<: *http-rule, behavior: domain, format: mrs}
  mrs-ip: &mrs-ip {<<: *http-rule, behavior: ipcidr, format: mrs}

rule-providers:
  # Loyalsoldier (yaml)
  applications: {<<: *yaml-class, url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"}

  # MetaCubeX (mrs)
  # reject_domain: {<<: *mrs-domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.mrs"}
  private_domain: {<<: *mrs-domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"}
  applecn_domain: {<<: *mrs-domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple@cn.mrs"}
  ai_domain: {<<: *mrs-domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ai-!cn.mrs"}
  google_domain: {<<: *mrs-domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google.mrs"}
  telegram_domain: {<<: *mrs-domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.mrs"}
  cn!_domain: {<<: *mrs-domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.mrs"}
  cn_domain: {<<: *mrs-domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"}

  private_ip: {<<: *mrs-ip, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs"}
  telegram_ip: {<<: *mrs-ip, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.mrs"}
  cn_ip: {<<: *mrs-ip, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs"}
